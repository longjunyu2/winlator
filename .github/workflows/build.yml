
name: 构建测试apk

on:
  workflow_dispatch:

jobs:
  build:
    name: "构建测试apk"
    runs-on: ubuntu-latest

    steps:
      - name: 0 下载项目源码和大文件
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: 1 安装依赖
        run: |
          sudo apt update
          sudo apt install -y libarchive-tools wget git-lfs

      - name: 2 检查 Git LFS 文件
        run: |
          git lfs version
          git lfs pull
          git lfs ls-files
          echo "Checking asset files..."
          find app/src/main/assets -type f -size -1k -print 2>/dev/null || true

      - name: 3 gradle验证
        uses: gradle/wrapper-validation-action@v2

      - name: 4 java配置
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 5 检查 OpenXR-SDK
        run: |
          ls -la app/src/main/cpp/OpenXR-SDK
          test -f app/src/main/cpp/OpenXR-SDK/CMakeLists.txt

      - name: 6 构建 APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 7 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
