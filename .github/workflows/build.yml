
name: 构建测试apk

on:
  workflow_dispatch:

jobs:
  build:
    name: "构建测试apk"
    runs-on: ubuntu-latest

    steps:
      - name: 0 下载项目源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 1 安装依赖
        run: |
          sudo apt update
          sudo apt install -y libarchive-tools wget

      - name: 2 gradle验证
        uses: gradle/wrapper-validation-action@v2

      - name: 3 java配置
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4 检查 OpenXR-SDK
        run: |
          ls -la app/src/main/cpp/OpenXR-SDK
          test -f app/src/main/cpp/OpenXR-SDK/CMakeLists.txt

      - name: 5 构建 APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 6 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
